# ez standard test workflow: lint, tests and build, plus the Docker image
# built, booted and healthy. Runs on PRs; pushes to development and master
# run it through publish.yml, before anything is published.
name: test

on:
  pull_request:
    branches: [development, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/ezmon_test
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile
          cd client && bun install --frozen-lockfile
      - name: 🧹 Lint (Biome)
        run: bun run lint
      - name: 🧪 Backend tests
        run: bun run test:backend
      - name: 🧪 Frontend tests
        run: bun run test:frontend
      - name: 🏗️ Build client
        run: bun run build-client

  docker:
    name: Docker image (build, boot, healthy)
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛠️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ezmon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 🔬 Boot and wait for healthy
        run: |
          set -euo pipefail
          docker network create ci
          docker run -d --name mongo --network ci mongo:7
          docker run -d --name app --network ci -e MONGO_URI=mongodb://mongo:27017/ezmon -e API_KEY="$(openssl rand -hex 24)" ezmon:ci
          status=starting
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "::error::container exited"; exit 1; }
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          test "$(docker exec app id -u)" = "1000"
      - name: 🧾 Container logs
        if: always()
        run: docker logs app || true
