name: Test

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/ezmon_test
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile
          cd client && bun install --frozen-lockfile

      - name: 🧹 Lint (Biome)
        run: bun run lint

      - name: 🧪 Backend tests
        run: bun run test:backend

      - name: 🧪 Frontend tests
        run: bun run test:frontend

      - name: 🏗️ Build client
        run: bun run build-client
