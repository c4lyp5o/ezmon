services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ezmon
      MONGO_INITDB_ROOT_PASSWORD: ezmon

  ezmon:
    image: ezmon:latest
    container_name: ezmon
    depends_on:
      - mongo
    restart: always
    # API_KEY, alert webhooks etc.; the Mongo URI is set in ecosystem.config.js.
    env_file:
      - path: .env
        required: false

volumes:
  mongo_data: